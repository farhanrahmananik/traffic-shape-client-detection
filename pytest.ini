[pytest]
# `pythonpath = src` and `pip install -e .` are not redundant -- they
# serve the uninstalled and the installed case respectively.
#
# The suite has to run on a fresh clone, before anything is installed
# and before any dependency has been chosen, so pytest finds the
# package by path. The editable install is what makes the `tsd-classify`
# console script exist for someone using the tool rather than testing
# it. Removing either one breaks a case the other never covered.
pythonpath = src
testpaths = tests
